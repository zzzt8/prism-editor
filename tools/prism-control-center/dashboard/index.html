<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism Visual Control Center V0</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="dashboard" id="app">
  <!-- Loading state -->
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在加载验证数据...</div>
  </div>

  <!-- Error state -->
  <div class="error-state" id="error" style="display:none">
    <div class="error-title">加载失败</div>
    <div id="error-msg"></div>
  </div>

  <!-- Main content (hidden until data loads) -->
  <div id="content" style="display:none">

    <!-- ── Header ─────────────────────────────────────────────────── -->
    <header class="header">
      <div class="header-inner">
        <div class="header-title">
          Prism Visual Control Center
          <span>V0.1</span>
        </div>

        <div class="meta-item">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M9.573.677L7.177 3.073a.25.25 0 0 1-.217.067l-2.5-.5a.25.25 0 0 1-.17-.427l1.913-1.697a.25.25 0 0 1 .335.089L8.5 2.146l1.44-1.44a.25.25 0 0 1 .633-.029zM2.5 5a.5.5 0 0 1 .5.5v6.5a.5.5 0 0 1-.817.387L1.5 11.8a.5.5 0 0 1-.183-.183l.5-1a.5.5 0 0 1 .683.683zM3 12v-5.5a.5.5 0 0 1 .5-.5H9a.5.5 0 0 1 .5.5V12l1.5 1.5a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0L5 14.708 3 12z"/>
          </svg>
          <span class="branch" id="header-branch"></span>
        </div>

        <div class="meta-item">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.418A6 6 0 1 1 8 2v1z"/>
            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966a.25.25 0 0 1 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
          </svg>
          <code id="header-commit"></code>
        </div>

        <div class="meta-item" id="header-dirty" style="display:none">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 1.5a.5.5 0 0 1 .5.5v5.793l1.146-1.147a.5.5 0 0 1 .708.708l-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 1 1 .708-.708L7.5 7.293V2a.5.5 0 0 1 1 0v4z"/>
          </svg>
          <span class="dirty">DIRTY</span>
        </div>

        <div class="meta-item">
          <span>Phase</span>
          <strong id="header-phase"></strong>
        </div>

        <div id="header-overall" class="overall-badge"></div>

        <div class="doc-warning" id="doc-warning" style="display:none">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
          </svg>
          架构源文档已变化
        </div>

        <div class="generated-at" id="generated-at"></div>
      </div>
    </header>

    <!-- ── Roadmap ──────────────────────────────────────────────── -->
    <section class="section" id="section-roadmap">
      <div class="section-header">
        <div class="section-title">M0-M7 里程碑路线图</div>
        <div class="section-divider"></div>
      </div>
      <div class="roadmap" id="roadmap"></div>
    </section>

    <!-- ── Architecture View ──────────────────────────────────── -->
    <section class="section" id="section-arch">
      <div class="section-header">
        <div class="section-title">目标架构视图</div>
        <div class="section-divider"></div>
      </div>
      <div class="arch-diagram">
        <svg class="arch-svg" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
          <!-- Background grid (subtle) -->
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262d" stroke-width="0.5"/>
            </pattern>
          </defs>
          <rect width="900" height="340" fill="url(#grid)"/>

          <!-- Dev Tool -->
          <rect x="20" y="20" width="160" height="80" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
          <text x="100" y="50" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Dev Tool</text>
          <text x="100" y="68" text-anchor="middle" fill="#8b949e" font-size="10">内部搭建器</text>
          <text x="100" y="82" text-anchor="middle" fill="#6e7681" font-size="9">模板 · Flow · 参数</text>

          <!-- Shared Protocol -->
          <rect x="210" y="20" width="180" height="80" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
          <text x="300" y="50" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Shared Protocol</text>
          <text x="300" y="68" text-anchor="middle" fill="#8b949e" font-size="10">ProductTemplate / Flow</text>
          <text x="300" y="82" text-anchor="middle" fill="#6e7681" font-size="9">DesignState / RenderResult</text>

          <!-- Arrow: Dev Tool → Shared Protocol -->
          <line x1="180" y1="60" x2="205" y2="60" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
          <defs>
            <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
            </marker>
          </defs>

          <!-- Mall Frontend -->
          <rect x="20" y="160" width="160" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,2"/>
          <text x="100" y="190" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="500">Mall 前端</text>
          <text x="100" y="207" text-anchor="middle" fill="#6e7681" font-size="9">用户交互 · 商品配置</text>
          <text x="100" y="221" text-anchor="middle" fill="#484f58" font-size="9">(不在 Prism 范围内)</text>

          <!-- Arrow: Mall Frontend → Browser Runtime -->
          <line x1="180" y1="170" x2="205" y2="170" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowgrey)"/>
          <defs>
            <marker id="arrowgrey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/>
            </marker>
          </defs>

          <!-- Browser Runtime -->
          <rect x="210" y="130" width="200" height="100" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
          <text x="310" y="158" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">Browser Runtime</text>
          <text x="310" y="175" text-anchor="middle" fill="#8b949e" font-size="10">无 UI 浏览器执行</text>
          <text x="310" y="191" text-anchor="middle" fill="#6e7681" font-size="9">Composer / Dev Tool 预览</text>
          <text x="310" y="207" text-anchor="middle" fill="#6e7681" font-size="9">实时预览 + 交互态执行</text>
          <text x="310" y="223" text-anchor="middle" fill="#3fb950" font-size="9">M0 当前：未真实运行</text>

          <!-- Arrow: Shared → Browser -->
          <line x1="300" y1="100" x2="300" y2="125" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>

          <!-- Production Runtime -->
          <rect x="210" y="260" width="200" height="70" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
          <text x="310" y="283" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">Production Runtime</text>
          <text x="310" y="300" text-anchor="middle" fill="#8b949e" font-size="10">Node 后端生产渲染</text>
          <text x="310" y="315" text-anchor="middle" fill="#6e7681" font-size="9">原始素材 · 稳定输出</text>

          <!-- Arrow: Shared → Production -->
          <line x1="300" y1="100" x2="300" y2="255" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowgreen)"/>
          <defs>
            <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
            </marker>
          </defs>

          <!-- Mall Backend -->
          <rect x="440" y="260" width="160" height="70" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,2"/>
          <text x="520" y="283" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="500">Mall 后端</text>
          <text x="520" y="300" text-anchor="middle" fill="#6e7681" font-size="10">DesignState · 原始素材</text>
          <text x="520" y="315" text-anchor="middle" fill="#6e7681" font-size="10">→ Production Runtime</text>

          <!-- Arrow: Browser → Mall Frontend (feedback) -->
          <line x1="410" y1="170" x2="185" y2="170" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowgrey)"/>

          <!-- Arrow: Mall Backend → Production Runtime -->
          <line x1="440" y1="295" x2="410" y2="295" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowgrey)"/>

          <!-- Output: 工厂数据包 -->
          <rect x="620" y="260" width="160" height="70" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,2"/>
          <text x="700" y="283" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="500">工厂数据包</text>
          <text x="700" y="300" text-anchor="middle" fill="#6e7681" font-size="10">(Mall / 工厂侧)</text>
          <text x="700" y="315" text-anchor="middle" fill="#484f58" font-size="9">(不在 Prism 范围内)</text>

          <!-- Arrow: Production → Factory -->
          <line x1="410" y1="295" x2="615" y2="295" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowgrey)"/>

          <!-- Legend -->
          <rect x="620" y="20" width="260" height="100" rx="4" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
          <text x="640" y="42" fill="#8b949e" font-size="10" font-weight="600">图例</text>
          <line x1="640" y1="52" x2="670" y2="52" stroke="#58a6ff" stroke-width="2"/>
          <text x="678" y="56" fill="#8b949e" font-size="9">Prism 内部数据流</text>
          <line x1="640" y1="67" x2="670" y2="67" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,2"/>
          <text x="678" y="71" fill="#8b949e" font-size="9">Mall / 外部系统</text>
          <line x1="640" y1="82" x2="670" y2="82" stroke="#3fb950" stroke-width="2"/>
          <text x="678" y="86" fill="#3fb950" font-size="9">Node Production Runtime</text>
          <line x1="640" y1="97" x2="670" y2="97" stroke="#f85149" stroke-width="2"/>
          <text x="678" y="101" fill="#f85149" font-size="9">当前 M0 未通路径</text>

          <!-- Data ownership note -->
          <rect x="620" y="130" width="260" height="120" rx="4" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
          <text x="640" y="150" fill="#8b949e" font-size="10" font-weight="600">数据归属边界</text>
          <text x="640" y="167" fill="#6e7681" font-size="9">Prism:</text>
          <text x="640" y="180" fill="#6e7681" font-size="9">  ProductTemplate / Flow</text>
          <text x="640" y="192" fill="#6e7681" font-size="9">  DesignState 协议 / RenderResult</text>
          <text x="640" y="204" fill="#6e7681" font-size="9">Mall:</text>
          <text x="640" y="217" fill="#6e7681" font-size="9">  用户 / SKU / 订单 / 业务记录</text>
          <text x="640" y="232" fill="#6e7681" font-size="9">Prism 禁止：</text>
          <text x="640" y="244" fill="#f85149" font-size="9">  userId/skuId/orderId 进 ProductTemplate</text>
        </svg>
        <div class="arch-doc-source">
          来源：docs/architecture/PRISM_TARGET_ARCHITECTURE.md · docs/architecture/PRISM_ARCHITECTURE_GUARDRAILS.md
        </div>
      </div>
    </section>

    <!-- ── Gate Matrix ────────────────────────────────────────── -->
    <section class="section" id="section-gates">
      <div class="section-header">
        <div class="section-title">质量门禁矩阵 — <span id="gates-phase-title">M0</span></div>
        <div class="section-divider"></div>
        <div id="gate-summary-badge"></div>
      </div>
      <div class="gate-table-wrap">
        <table class="gate-table">
          <thead>
            <tr>
              <th>状态</th>
              <th>Gate</th>
              <th>判断理由</th>
              <th>命令</th>
              <th>Exit</th>
              <th>Evidence</th>
              <th>最后执行</th>
            </tr>
          </thead>
          <tbody id="gate-table-body">
          </tbody>
        </table>
      </div>
    </section>

    <!-- ── Visual Evidence ─────────────────────────────────────── -->
    <section class="section" id="section-evidence">
      <div class="section-header">
        <div class="section-title">可视化证据</div>
        <div class="section-divider"></div>
      </div>
      <div class="evidence-grid" id="evidence-grid"></div>
    </section>

    <!-- ── Metrics ─────────────────────────────────────────────── -->
    <section class="section" id="section-metrics">
      <div class="section-header">
        <div class="section-title">几何一致性数值 — metrics.json</div>
        <div class="section-divider"></div>
      </div>
      <div id="metrics-content"></div>
    </section>

    <!-- ── Blockers ───────────────────────────────────────────── -->
    <section class="section" id="section-blockers">
      <div class="section-header">
        <div class="section-title">阻塞原因</div>
        <div class="section-divider"></div>
      </div>
      <div id="blockers-content"></div>
    </section>

    <!-- ── Git Impact ─────────────────────────────────────────── -->
    <section class="section" id="section-git">
      <div class="section-header">
        <div class="section-title">Git 修改影响范围</div>
        <div class="section-divider"></div>
      </div>
      <div id="git-content"></div>
    </section>

  </div><!-- /#content -->
</div><!-- /.dashboard -->

<script src="app.js"></script>
</body>
</html>
