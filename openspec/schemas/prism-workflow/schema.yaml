name: prism-workflow
version: 2
description: Prism Editor 专用 workflow — proposal → specs → design → tasks → verify
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.

      Before generating artifacts, perform Task Anchor Echo to confirm the change
      name aligns with the original task. The change name must match the original
      task theme — if not, hard-gate and stop.

      Sections:

      - **Task Anchor Echo**: Echo the original task, confirm change name alignment,
        record any constraints/non-goals added by the user (must be written to
        Out of Scope).
      - **Why**: 1-2 sentences on the problem or opportunity.
      - **What Changes**: Bullet list. Mark breaking changes with **BREAKING**.
      - **Capabilities**: New capabilities → specs/<name>/spec.md;
        Modified capabilities → delta spec in specs/.
      - **Impact**: Affected code, APIs, dependencies, or systems.
      - **Out of Scope**: Constraints and non-goals from user input.
      - **质量与测试规范要求**: After Out of Scope, add the quality checklist
        table (quality dimensions check) and acceptance criteria from
        specs/QUALITY_STANDARDS.md. This is MANDATORY for all changes.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.
      Delta operations (## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior — MUST include full updated content
      - **REMOVED Requirements**: Deprecated — MUST include **Reason** and **Migration**
      Format: each requirement with `### Requirement: <name>` + `#### Scenario: <name>`
      with WHEN/THEN format (exactly 4 hashtags `####` for scenarios).
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.
      Sections: Context, Goals/Non-Goals, Decisions, Risks/Trade-offs,
      Migration Plan, Open Questions.
      When change involves engine/backend or cross-app modifications,
      include Architecture Review section.
      When change_class = high, insert formal review checklist.
      **质量合规性**: After Review Checklist, add the quality compliance section
      from specs/QUALITY_STANDARDS.md covering execution integrity, invariants,
      and test strategy. This is MANDATORY for all changes.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work.
      Each task MUST be a checkbox: `- [ ] X.Y Task description`
      Group under ## numbered headings.
      **id uniqueness (MANDATORY)**: every task id must be globally unique within
      the change. If two tasks share the same base id (e.g. T6), append a letter
      suffix: T6a, T6b. Duplicate ids are a schema violation — detect and report
      before execution. Do not reuse the same id across different layers.
      **File path is mandatory**: every task description must include the target file path
      relative to repo root, e.g. "修复 `apps/dev-tool/src/stores/canvasStore.ts` 中的 bug"。
      Do not write tasks without file paths — the agent needs to locate the code without searching.
      **验收标准必须可验证**: acceptance criteria must be stated as observable,
      verifiable conditions — NOT as implementation requirements. Examples:
      - GOOD: "clipboard 字段存在于 canvasStore.ts 且类型为 NodeOrEdge[]"
      - GOOD: "pnpm exec tsc --noEmit 无错误"
      - BAD: "复制节点后刷新页面，粘贴仍可用" (requires runtime state, not verifiable in code review)
      - BAD: "两个 store 共享同一个 adapter 实例" (requires runtime object identity check)
      If an acceptance criterion cannot be verified without running the app, split it
      into a code-level sub-task (verifiable) and a manual sub-task (marked as manual).
      Support task metadata via HTML comments:
      ```html
      <!-- opsx-meta
      id: T1
      layer: engine
      verify: unit-tests
      dependencies:
        - type: task
          refs: []
      -->
      ```
      **layer**: editor | runtime | backend | engine | ui-skin | meta
      **verify**: unit-tests | golden-fixture | api-tests | smoke-test | visual-check
      Execute in layer priority order: engine > backend > editor > runtime >
      ui-skin > meta. When change_class = high, include standalone Test Design
      section. When change_class = low, merge tests into task verification commands.
      **质量合规性验收**: Append the N.1~N.5 quality compliance checklist from
      specs/QUALITY_STANDARDS.md as the final section. This is MANDATORY for all changes.
    requires:
      - specs
      - design
  - id: verify
    generates: verify.md
    description: Verification report — full verification + coherence-lite checklist
    template: verify.md
    instruction: >
      Execute the verify template (templates/verify.md) for this change.
      Sections: Full Metadata Check, Test Failure Attribution (mandatory),
      Coherence-lite Check, Traceability Map, High-Risk Traceability
      (when change_class = high), Verify Result.
      verify does NOT modify code — it only checks and reports issues.
    requires:
      - tasks
apply:
  requires:
    - tasks
  tracks: tasks.md
verify:
  requires:
    - tasks
  tracks: tasks.md